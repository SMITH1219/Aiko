<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#18101a"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100d0a">
<title>Aiko — Compagnon 3D (VRM)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #100d0a; color: #f4efe8;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    overflow: hidden; height: 100vh; height: 100dvh;
  }
  main { position: relative; max-width: 640px; height: 100%; margin: 0 auto; }
  #stage {
    position: absolute; inset: 0 0 var(--ctl, 0px) 0; cursor: grab; touch-action: none;
    background: radial-gradient(120% 90% at 50% 30%, #241b14 0%, #120e0b 62%, #0a0806 100%);
  }
  #stage.dragging { cursor: grabbing; }
  canvas { display: block; }
  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
    padding: calc(16px + env(safe-area-inset-top)) 18px 0;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: .5px; text-shadow: 0 2px 6px #000; }
  #mode { font-size: 12px; color: #b3a294; text-shadow: 0 1px 3px #000; margin-top: 2px; }
  #status {
    flex: 0 0 auto; width: 12px; height: 12px; border-radius: 50%; margin-top: 9px;
    background: #ef4444; box-shadow: 0 0 8px rgba(239,68,68,.55); transition: all .3s;
  }
  #status.ready { background: #10b981; box-shadow: 0 0 10px rgba(16,185,129,.7); }
  #status.backend { background: #38bdf8; box-shadow: 0 0 10px rgba(56,189,248,.7); }
  #thinking-indicator {
    position: absolute; top: calc(70px + env(safe-area-inset-top)); right: 18px; z-index: 5;
    display: flex; gap: 4px; align-items: center;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  #thinking-indicator.active { opacity: 1; }
  #thinking-indicator .dot {
    width: 6px; height: 6px; background: #d5560f; border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  #thinking-indicator .dot:nth-child(1) { animation-delay: -0.32s; }
  #thinking-indicator .dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }
  #log {
    pointer-events: auto; position: relative; margin: 0 0 8px; padding: 10px 14px; max-height: 22dvh; overflow-y: auto; scrollbar-width: thin;
    border-radius: 16px; background: rgba(16,13,10,.80); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid #3a3029; font-size: 16px; line-height: 1.55; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  #log:empty { display: none; }
  #log.big { max-height: 40dvh; }
  #log p { overflow-wrap: anywhere; }
  #log .me { font-size: 14px; }
  #attach-chip { pointer-events: auto; display: flex; align-items: center; gap: 8px; margin: 0 2px 6px; padding: 6px 12px; border-radius: 14px; background: rgba(213,86,15,.18); border: 1px solid #d5560f; color: #ffe9d6; font-size: 13px; }
  #attach-chip[hidden] { display: none; }
  #attach-chip span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #attach-chip button { background: none; border: 0; color: #ffe9d6; font-size: 16px; padding: 0 4px; cursor: pointer; }
  #log p { margin: 0 0 10px; animation: msgIn .3s ease-out; }
  #log .me { color: #b3a294; }
  #log .ai { color: #ffe9d6; font-weight: 500; }
  #log .err { color: #e58b76; }
  #log .sys { color: #9fc7d8; font-size: 12px; }
  #log .ask { color: #ffd9a8; pointer-events: auto; }
  #log .choices { pointer-events: auto; display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
  #log .choices button { padding: 5px 12px; border-radius: 14px; border: 1px solid #f0b48a; background: rgba(20,12,8,.6); color: #ffe9d6; font-size: 13px; }
  #log .ask button { margin-left: 8px; padding: 3px 10px; border-radius: 12px; border: 1px solid #ffd9a8; background: rgba(0,0,0,.45); color: #ffd9a8; font-size: 12px; }
  #mind { position: absolute; z-index: 9; left: 10px; right: 10px; top: calc(70px + env(safe-area-inset-top)); bottom: calc(84px + env(safe-area-inset-bottom));
    overflow-y: auto; padding: 12px 14px; border-radius: 16px; background: rgba(16,13,10,.96); border: 1px solid #3a3029; color: #eadfd5; font-size: 14px; }
  #mind[hidden] { display: none; }
  #mind .mind-head { display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
  #mind .mind-head button, #mind .mi button { background: none; border: 0; color: #c9b8a8; font-size: 16px; padding: 2px 6px; cursor: pointer; }
  #mind .mind-hint { font-size: 12px; color: #a8998b; margin: 4px 0 6px; }
  #mind h4 { margin: 12px 0 4px; color: #f0b48a; font-size: 12px; letter-spacing: .5px; text-transform: uppercase; }
  #mind .mi { display: flex; gap: 6px; align-items: flex-start; padding: 5px 0; border-bottom: 1px solid #2a221c; }
  #mind .mi span { flex: 1; }
  #mind .mi.done span { text-decoration: line-through; color: #8a7d71; }
  #mind .mi input { flex: 1; background: #221b15; color: #f4efe8; border: 1px solid #453a31; border-radius: 8px; padding: 4px 6px; font-size: 14px; }
  #mind .mind-empty { color: #8a7d71; font-size: 13px; }
  #mind .wipe { margin-top: 16px; width: 100%; padding: 8px; border-radius: 12px; border: 1px solid #7a3b2c; background: transparent; color: #e58b76; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .controls {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; pointer-events: none;
    padding: 26px 12px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(10,8,6,.85) 40%, rgba(10,8,6,0));
  }
  #panel {
    pointer-events: auto; max-height: 46vh; overflow-y: auto; scrollbar-width: none;
    margin-bottom: 10px; padding: 10px 8px; border-radius: 16px;
    background: rgba(16,13,10,.82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid #3a3029; animation: panelIn .18s ease-out;
  }
  #panel::-webkit-scrollbar { display: none; }
  #panel[hidden] { display: none; }
  @keyframes panelIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  #panel #wardrobe { margin-bottom: 8px; }
  #btn-panel { min-width: 44px; min-height: 44px; border-radius: 999px; border: 1px solid #453a31; background: rgba(16,13,10,.9); color: #f4efe8; font-size: 18px; cursor: pointer; }
  #btn-panel.on { background: #d5560f; border-color: #d5560f; }
  .row { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; pointer-events: auto; padding: 3px 2px; }
  .row::-webkit-scrollbar { display: none; }
  .row + .row { margin-top: 8px; }
  .chip {
    flex: 0 0 auto; min-height: 34px; padding: 6px 13px; border-radius: 999px;
    border: 1px solid #453a31; background: rgba(28,22,17,.82); color: #c9b8a8;
    font-size: 12.5px; font-weight: 600; white-space: nowrap; cursor: pointer;
    backdrop-filter: blur(6px); transition: background .18s, color .18s, border-color .18s;
    user-select: none; -webkit-user-select: none;
  }
  .chip.on { background: #d5560f; border-color: #d5560f; color: #fff; }
  .chip.off { opacity: .45; }
  [hidden] { display: none !important; }
  .chip:active { transform: scale(.97); }
  form { display: flex; gap: 6px; pointer-events: auto; margin-top: 8px; align-items: center; }
  form > button { flex: 0 0 42px; width: 42px; min-width: 42px !important; height: 42px; min-height: 42px !important; padding: 0; }
  #chat-input { min-width: 0; }
  #quick { margin-top: 8px; pointer-events: auto; }
  #log .fb { display: inline-flex; gap: 2px; margin-left: 6px; vertical-align: middle; pointer-events: auto; opacity: .55; }
  #log .fb button { border: 0; background: none; font-size: 13px; padding: 2px 4px; cursor: pointer; filter: grayscale(.6); }
  #log .fb.sent button:not(.on) { display: none; }
  #log .fb button.on { filter: none; }
  #quick .chip { min-height: 32px; padding: 5px 11px; }
  #ptabs { display: flex; gap: 6px; margin-bottom: 8px; position: sticky; top: -1px; z-index: 2; padding: 4px 0 6px; background: inherit; }
  #ptabs .chip { flex: 1; text-align: center; }
  #chat-input {
    flex: 1; min-height: 44px; border-radius: 999px; border: 1px solid #453a31;
    background: rgba(16,13,10,.9); color: #f4efe8; padding: 0 18px; outline: none;
    font-size: 16px; /* 16px : évite le zoom automatique d'iOS au focus */
  }
  #chat-input:focus { border-color: #d5560f; }
  #btn-send:disabled { opacity: .5; }
  #btn-send {
    min-width: 44px; min-height: 44px; border: 0; border-radius: 999px;
    background: #d5560f; color: #fff; font-size: 17px; cursor: pointer;
  }
  #btn-send:active { transform: scale(.95); }
  #btn-mic {
    min-width: 44px; min-height: 44px; border-radius: 999px; border: 1px solid #453a31;
    background: rgba(16,13,10,.9); color: #f4efe8; font-size: 17px; cursor: pointer;
  }
  #btn-mic.on { background: #d5560f; border-color: #d5560f; }
  #btn-photo { min-width: 44px; min-height: 44px; border-radius: 999px; border: 1px solid #453a31; background: rgba(16,13,10,.9); color: #f4efe8; font-size: 17px; cursor: pointer; }
  #btn-photo.on { background: #d5560f; border-color: #d5560f; }
  #log img.shot { display: block; max-width: 120px; max-height: 120px; border-radius: 8px; margin-top: 4px; }
  .credit { pointer-events: auto; font-size: 10px; color: #8a7d6f; text-align: center; margin-top: 8px; }
  #toast {
    position: absolute; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%) translateY(-6px);
    z-index: 7; padding: 8px 16px; border-radius: 999px; background: rgba(20,15,11,.92);
    border: 1px solid #453a31; color: #ffe9d6; font-size: 13px; pointer-events: none;
    opacity: 0; transition: opacity .25s, transform .25s; white-space: nowrap; max-width: 90%;
    overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #loader {
    position: absolute; inset: 0; z-index: 20; background: #100d0a;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    transition: opacity .5s; padding: 24px; text-align: center;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 42px; height: 42px; border-radius: 50%; border: 4px solid #2c241d; border-top-color: #d5560f; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader-msg { font-size: 13.5px; color: #b3a294; max-width: 340px; line-height: 1.5; }
  #loader-retry { min-height: 38px; padding: 8px 18px; border-radius: 999px; border: 1px solid #d5560f; background: transparent; color: #d5560f; font-weight: 700; cursor: pointer; }
#wardrobe { display: flex; flex-direction: column; gap: 6px; }
#wardrobe .wr { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; align-items: center; }
#wardrobe .wr::-webkit-scrollbar { display: none; }
#wardrobe .wl { font-size: 11px; font-weight: 700; color: #b9aea4; min-width: 52px; text-transform: uppercase; letter-spacing: .04em; }
#wardrobe .chip { flex: none; }
#wardrobe .sw { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); padding: 0; cursor: pointer; }
#wardrobe .sw.on { border-color: #fff; box-shadow: 0 0 0 2px #d5560f; }
#wardrobe .sw.reset { background: transparent; color: #b9aea4; font-size: 14px; line-height: 20px; text-align: center; }
#wardrobe input[type=color] { flex: none; width: 30px; height: 26px; padding: 0; border: 0; background: none; cursor: pointer; }
</style>
<script>
window.AIKO_LIBS = 'cdn';
// Toute erreur s'affiche à l'écran : plus jamais d'écran noir muet.
window.__errs = [];
function __showErr(m) {
  window.__errs.push(m);
  var b = document.getElementById('errbox');
  if (!b) { b = document.createElement('div'); b.id = 'errbox';
    b.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#3a0d0d;color:#ffd9d2;font:12px/1.4 monospace;padding:8px 10px;border-radius:8px;white-space:pre-wrap;max-height:40vh;overflow:auto';
    (document.body || document.documentElement).appendChild(b); }
  b.textContent = 'Erreur de la page (envoie-moi ce texte) :\n' + window.__errs.slice(-4).join('\n');
}
window.addEventListener('error', function (e) {
  if (e.target && e.target.tagName === 'SCRIPT' && !e.message) {   // module qui ne se charge pas : on dit quel fichier manque et quoi faire
    var why = location.protocol === 'file:' ? 'La page est ouverte directement depuis un fichier : ouvre-la par l\'adresse du serveur (run.sh ou ton site), pas en double-cliquant index.html.' : 'Vérifie que aiko-3d.js est dans le même dossier que index.html (static/) et vide le cache du navigateur.';
    fetch('./aiko-3d.js', { method: 'GET', cache: 'no-store' }).then(function (r) { __showErr('aiko-3d.js : ' + (r.ok ? 'trouvé mais refusé par le navigateur (type de fichier ?)' : 'introuvable (code ' + r.status + ')') + '. ' + why); }).catch(function () { __showErr('aiko-3d.js : inaccessible. ' + why); });
    return;
  }
 __showErr((e.message || (e.target && e.target.tagName === 'SCRIPT' ? 'un script de la page n\'a pas pu se charger' : 'erreur')) + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : (e.target && e.target.src ? ' — fichier bloqué : ' + e.target.src + ' (vérifie que ce fichier est dans le même dossier que index.html et ouvre l\'adresse du serveur, pas le fichier en double-cliquant)' : ''))); }, true);
window.addEventListener('unhandledrejection', function (e) { var r = e.reason || {}; __showErr('promesse : ' + (r.message || r.code || String(r))); });
</script>
</head>
<body>
<main>
  <div id="stage"></div>
  <header>
    <div>
      <h1>Aiko</h1>
      <div id="mode">Chargement…</div>
    </div>
    <div id="status"></div>
  </header>
  <div id="thinking-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div id="toast"></div>
  <div id="mind" hidden role="dialog" aria-label="Ce qu'Aiko sait de toi">
    <div class="mind-head"><b>Ce qu'Aiko sait de toi</b><button type="button" id="mind-close" aria-label="Fermer">✕</button></div>
    <div class="mind-hint">Tout ce qu'elle a retenu. Touche ✎ pour corriger, ✕ pour effacer. Tu peux aussi lui dire « oublie que… ».</div>
    <div id="mind-body"></div>
  </div>
  <div class="controls">
    <div id="log" aria-live="polite"></div>
   <div id="panel" hidden>
    <div id="ptabs" role="tablist">
      <button class="chip on" type="button" data-ptab="tenues">Tenues</button>
      <button class="chip" type="button" data-ptab="pose">Pose</button>
      <button class="chip" type="button" data-ptab="reglages">Réglages</button>
    </div>
    <div class="row" id="row-outfit" data-tab="tenues" role="group" aria-label="Tenue">
      <button class="chip" type="button" data-outfit="nue">Nue</button>
      <button class="chip" type="button" data-outfit="moitie">Moitié</button>
      <button class="chip" type="button" data-outfit="habillee">Habillée</button>
    </div>
    <div id="wardrobe" data-tab="tenues" hidden></div>
    <div class="row" id="row-tint" data-tab="tenues" role="group" aria-label="Couleur de la tenue" hidden>
      <button class="chip" type="button" data-tint="">Gris</button>
      <button class="chip" type="button" data-tint="#16161a">Noir</button>
      <button class="chip" type="button" data-tint="#1d2a4d">Marine</button>
      <button class="chip" type="button" data-tint="#6b1626">Bordeaux</button>
      <button class="chip" type="button" data-tint="#14503f">Émeraude</button>
      <button class="chip" type="button" data-tint="#b9a58a">Sable</button>
    </div>
    <div class="row" id="row-pose" data-tab="pose" role="group" aria-label="Pose">
      <button class="chip" type="button" data-pose="front">Debout</button>
      <button class="chip" type="button" data-pose="sit">Assise</button>
      <button class="chip" type="button" data-pose="side">De côté</button>
      <button class="chip" type="button" data-pose="bed">Allongée</button>
    </div>
    <div class="row" id="row-shape" data-tab="pose" style="align-items:center;gap:10px">
      <label for="shape" style="font-size:12px;font-weight:700;color:#d8cfc6;white-space:nowrap">Silhouette</label>
      <input type="range" id="shape" min="0" max="100" step="5" style="flex:1;min-width:0;accent-color:#d5560f" aria-label="Silhouette : de fine à pulpeuse">
    </div>
    <div class="row" data-tab="reglages" role="group" aria-label="Options" style="flex-wrap:wrap;gap:6px 6px">
      <button class="chip on" type="button" id="btn-cheveux">Cheveux</button>
      <button class="chip" type="button" id="btn-lunettes">Lunettes</button>
      <button class="chip on" type="button" id="btn-voix">Voix</button>
      <button class="chip" type="button" id="btn-mind">Ce qu'elle sait de moi</button>
      <button class="chip" type="button" id="btn-phone">📱 Sur mon téléphone</button>
      <button class="chip" type="button" id="btn-brain">🧠 Cerveau (modèle)</button>
      <button class="chip" type="button" id="btn-reset">Réinitialiser</button>
      <label class="chip" for="file-vrm">＋ VRM perso</label>
      <input type="file" id="file-vrm" accept=".vrm,.glb" hidden>
    </div>
    <div class="credit" id="credit" data-tab="reglages"></div>
   </div>
    <div id="attach-chip" hidden><span></span><button type="button" aria-label="Retirer la pièce jointe">✕</button></div>
    <form id="chat-form" autocomplete="off">
      <button id="btn-panel" type="button" aria-label="Tenues, poses et réglages" aria-expanded="false">👗</button>
      <input id="chat-input" type="text" placeholder="Écris à Aiko…" maxlength="2000" enterkeyhint="send">
      <button id="btn-photo" type="button" aria-label="Joindre une image ou un document">📎</button>
      <input id="file-photo" type="file" accept="image/*,.txt,.md,.csv,.json,.html,.xml,.log,.docx,.pdf,.glb,.vrm" hidden>
      <button id="btn-mic" type="button" aria-label="Parler à Aiko">🎤</button>
      <button id="btn-send" type="submit" aria-label="Envoyer">➤</button>
    </form>
  </div>
  <div id="loader">
    <div class="spinner"></div>
    <div id="loader-msg">Chargement du modèle 3D…</div>
    <button id="loader-retry" type="button" hidden>Réessayer</button>
  </div>
</main>
<script>
/* Si les bibliothèques 3D n'arrivent pas (pas de réseau, CDN bloqué), on le dit au lieu de tourner sans fin. */
setTimeout(function () {
  if (!window.AIKO_STARTED) {
    document.getElementById('loader-msg').textContent =
      'Impossible de charger les bibliothèques 3D. Vérifie la connexion puis recharge la page.';
  }
}, 12000);
</script>
<script type="module">
