<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#18101a"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100d0a">
<title>Aiko — Compagnon 3D (VRM)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #100d0a; color: #f4efe8;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    overflow: hidden; height: 100vh; height: 100dvh;
  }
  main { position: relative; max-width: 640px; height: 100%; margin: 0 auto; }
  #stage {
    position: absolute; inset: 0 0 var(--ctl, 0px) 0; cursor: grab; touch-action: none;
    background: radial-gradient(120% 90% at 50% 30%, #241b14 0%, #120e0b 62%, #0a0806 100%);
  }
  #stage.dragging { cursor: grabbing; }
  canvas { display: block; }
  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
    padding: calc(16px + env(safe-area-inset-top)) 18px 0;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: .5px; text-shadow: 0 2px 6px #000; }
  #mode { font-size: 12px; color: #b3a294; text-shadow: 0 1px 3px #000; margin-top: 2px; }
  #status {
    flex: 0 0 auto; width: 12px; height: 12px; border-radius: 50%; margin-top: 9px;
    background: #ef4444; box-shadow: 0 0 8px rgba(239,68,68,.55); transition: all .3s;
  }
  #status.ready { background: #10b981; box-shadow: 0 0 10px rgba(16,185,129,.7); }
  #status.backend { background: #38bdf8; box-shadow: 0 0 10px rgba(56,189,248,.7); }
  #thinking-indicator {
    position: absolute; top: calc(70px + env(safe-area-inset-top)); right: 18px; z-index: 5;
    display: flex; gap: 4px; align-items: center;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  #thinking-indicator.active { opacity: 1; }
  #thinking-indicator .dot {
    width: 6px; height: 6px; background: #d5560f; border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  #thinking-indicator .dot:nth-child(1) { animation-delay: -0.32s; }
  #thinking-indicator .dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }
  #log {
    pointer-events: auto; position: relative; margin: 0 0 8px; padding: 10px 14px; max-height: 22dvh; overflow-y: auto; scrollbar-width: thin;
    border-radius: 16px; background: rgba(16,13,10,.80); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid #3a3029; font-size: 16px; line-height: 1.55; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  #log:empty { display: none; }
  #log.big { max-height: 40dvh; }
  #log p { overflow-wrap: anywhere; }
  #log .me { font-size: 14px; }
  #attach-chip { pointer-events: auto; display: flex; align-items: center; gap: 8px; margin: 0 2px 6px; padding: 6px 12px; border-radius: 14px; background: rgba(213,86,15,.18); border: 1px solid #d5560f; color: #ffe9d6; font-size: 13px; }
  #attach-chip[hidden] { display: none; }
  #attach-chip span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #attach-chip button { background: none; border: 0; color: #ffe9d6; font-size: 16px; padding: 0 4px; cursor: pointer; }
  #log p { margin: 0 0 10px; animation: msgIn .3s ease-out; }
  #log .me { color: #b3a294; }
  #log .ai { color: #ffe9d6; font-weight: 500; }
  #log .err { color: #e58b76; }
  #log .sys { color: #9fc7d8; font-size: 12px; }
  #log .ask { color: #ffd9a8; pointer-events: auto; }
  #log .choices { pointer-events: auto; display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
  #log .choices button { padding: 5px 12px; border-radius: 14px; border: 1px solid #f0b48a; background: rgba(20,12,8,.6); color: #ffe9d6; font-size: 13px; }
  #log .ask button { margin-left: 8px; padding: 3px 10px; border-radius: 12px; border: 1px solid #ffd9a8; background: rgba(0,0,0,.45); color: #ffd9a8; font-size: 12px; }
  #mind { position: absolute; z-index: 9; left: 10px; right: 10px; top: calc(70px + env(safe-area-inset-top)); bottom: calc(84px + env(safe-area-inset-bottom));
    overflow-y: auto; padding: 12px 14px; border-radius: 16px; background: rgba(16,13,10,.96); border: 1px solid #3a3029; color: #eadfd5; font-size: 14px; }
  #mind[hidden] { display: none; }
  #mind .mind-head { display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
  #mind .mind-head button, #mind .mi button { background: none; border: 0; color: #c9b8a8; font-size: 16px; padding: 2px 6px; cursor: pointer; }
  #mind .mind-hint { font-size: 12px; color: #a8998b; margin: 4px 0 6px; }
  #mind h4 { margin: 12px 0 4px; color: #f0b48a; font-size: 12px; letter-spacing: .5px; text-transform: uppercase; }
  #mind .mi { display: flex; gap: 6px; align-items: flex-start; padding: 5px 0; border-bottom: 1px solid #2a221c; }
  #mind .mi span { flex: 1; }
  #mind .mi.done span { text-decoration: line-through; color: #8a7d71; }
  #mind .mi input { flex: 1; background: #221b15; color: #f4efe8; border: 1px solid #453a31; border-radius: 8px; padding: 4px 6px; font-size: 14px; }
  #mind .mind-empty { color: #8a7d71; font-size: 13px; }
  #mind .wipe { margin-top: 16px; width: 100%; padding: 8px; border-radius: 12px; border: 1px solid #7a3b2c; background: transparent; color: #e58b76; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .controls {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; pointer-events: none;

  #panel {
    pointer-events: auto; max-height: 46vh; overflow-y: auto; scrollbar-width: none;
    margin-bottom: 10px; padding: 10px 8px; border-radius: 16px;

  .chip {

    border: 1px solid #453a31; background: rgba(28,22,17,.82); color: #c9b8a8;
    font-size: 12.5px; font-weight: 600; white-space: nowrap; cursor: pointer;

    user-select: none; -webkit-user-select: none;
  }
  .chip.on { background: #d5560f; border-color: #d5560f; color: #fff; }
  .chip.off { opacity: .45; }
  [hidden] { display: none !important; }
  .chip:active { transform: scale(.97); }
  form { display: flex; gap: 6px; pointer-events: auto; margin-top: 8px; align-items: center; }
  form > button { flex: 0 0 42px; width: 42px; min-width: 42px !important; height: 42px; min-height: 42px !important; padding: 0; }
  #chat-input { min-width: 0; }
  #quick { margin-top: 8px; pointer-events: auto; }
  #log .fb { display: inline-flex; gap: 2px; margin-left: 6px; vertical-align: middle; pointer-events: auto; opacity: .55; }
  #log .fb button { border: 0; background: none; font-size: 13px; padding: 2px 4px; cursor: pointer; filter: grayscale(.6); }
  #log .fb.sent button:not(.on) { display: none; }
  #log .fb button.on { filter: none; }
  #quick .chip { min-height: 32px; padding: 5px 11px; }
  #ptabs { display: flex; gap: 6px; margin-bottom: 8px; position: sticky; top: -1px; z-index: 2; padding: 4px 0 6px; background: inherit; }
  #ptabs .chip { flex: 1; text-align: center; }
  #chat-input {
    flex: 1; min-height: 44px; border-radius: 999px; border: 1px solid #453a31;
    background: rgba(16,13,10,.9); color: #f4efe8; padding: 0 18px; outline: none;
    font-size: 16px; /* 16px : évite le zoom automatique d'iOS au focus */
  }
  #chat-input:focus { border-color: #d5560f; }
  #btn-send:disabled { opacity: .5; }
  #btn-send {
    min-width: 44px; min-height: 44px; border: 0; border-radius: 999px;
    background: #d5560f; color: #fff; font-size: 17px; cursor: pointer;
  }
  #btn-send:active { transform: scale(.95); }
  #btn-mic {
    min-width: 44px; min-height: 44px; border-radius: 999px; border: 1px solid #453a31;
    background: rgba(16,13,10,.9); color: #f4efe8; font-size: 17px; cursor: pointer;
  }
  #btn-mic.on { background: #d5560f; border-color: #d5560f; }
  #btn-photo { min-width: 44px; min-height: 44px; border-radius: 999px; border: 1px solid #453a31; background: rgba(16,13,10,.9); color: #f4efe8; font-size: 17px; cursor: pointer; }
  #btn-photo.on { background: #d5560f; border-color: #d5560f; }
  #log img.shot { display: block; max-width: 120px; max-height: 120px; border-radius: 8px; margin-top: 4px; }
  .credit { pointer-events: auto; font-size: 10px; color: #8a7d6f; text-align: center; margin-top: 8px; }
  #toast {
    position: absolute; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translateX(-50%) translateY(-6px);
    z-index: 7; padding: 8px 16px; border-radius: 999px; background: rgba(20,15,11,.92);
    border: 1px solid #453a31; color: #ffe9d6; font-size: 13px; pointer-events: none;
    opacity: 0; transition: opacity .25s, transform .25s; white-space: nowrap; max-width: 90%;
    overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #loader {
    position: absolute; inset: 0; z-index: 20; background: #100d0a;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    transition: opacity .5s; padding: 24px; text-align: center;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 42px; height: 42px; border-radius: 50%; border: 4px solid #2c241d; border-top-color: #d5560f; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader-msg { font-size: 13.5px; color: #b3a294; max-width: 340px; line-height: 1.5; }
  #loader-retry { min-height: 38px; padding: 8px 18px; border-radius: 999px; border: 1px solid #d5560f; background: transparent; color: #d5560f; font-weight: 700; cursor: pointer; }
#wardrobe { display: flex; flex-direction: column; gap: 6px; }
#wardrobe .wr { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; align-items: center; }
#wardrobe .wr::-webkit-scrollbar { display: none; }
#wardrobe .wl { font-size: 11px; font-weight: 700; color: #b9aea4; min-width: 52px; text-transform: uppercase; letter-spacing: .04em; }
#wardrobe .chip { flex: none; }
#wardrobe .sw { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); padding: 0; cursor: pointer; }
#wardrobe .sw.on { border-color: #fff; box-shadow: 0 0 0 2px #d5560f; }
#wardrobe .sw.reset { background: transparent; color: #b9aea4; font-size: 14px; line-height: 20px; text-align: center; }
#wardrobe input[type=color] { flex: none; width: 30px; height: 26px; padding: 0; border: 0; background: none; cursor: pointer; }
</style>
<script>
window.AIKO_LIBS = 'cdn';
// Toute erreur s'affiche à l'écran : plus jamais d'écran noir muet.
window.__errs = [];

  window.__errs.push(m);
  var b = document.getElementById('errbox');
  if (!b) { b = document.createElement('div'); b.id = 'errbox';
    b.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#3a0d0d;color:#ffd9d2;font:12px/1.4 monospace;padding:8px 10px;border-radius:8px;white-space:pre-wrap;max-height:40vh;overflow:auto';
    (document.body || document.documentElement).appendChild(b); }
  b.textContent = 'Erreur de la page (envoie-moi ce texte) :\n' + window.__errs.slice(-4).join('\n');
}
window.addEventListener('error', function (e) {

    var why = location.protocol === 'file:' ? 'La page est ouverte directement depuis un fichier : ouvre-la par l\'adresse du serveur (run.sh ou ton site), pas en double-cliquant index.html.' : 'Vérifie que aiko-3d.js est dans le même dossier que index.html (static/) et vide le cache du navigateur.';
    fetch('./aiko-3d.js', { method: 'GET', cache: 'no-store' }).then(function (r) { __showErr('aiko-3d.js : ' + (r.ok ? 'trouvé mais refusé par le navigateur (type de fichier ?)' : 'introuvable (code ' + r.status + ')') + '. ' + why); }).catch(function () { __showErr('aiko-3d.js : inaccessible. ' + why); });
    return;
  }
 __showErr((e.message || (e.target && e.target.tagName === 'SCRIPT' ? 'un script de la page n\'a pas pu se charger' : 'erreur')) + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : (e.target && e.target.src ? ' — fichier bloqué : ' + e.target.src + ' (vérifie que ce fichier est dans le même dossier que index.html et ouvre l\'adresse du serveur, pas le fichier en double-cliquant)' : ''))); }, true);
window.addEventListener('unhandledrejection', function (e) { var r = e.reason || {}; __showErr('promesse : ' + (r.message || r.code || String(r))); });
</script>
</head>
<body>
<main>
  <div id="stage"></div>
  <header>
    <div>
      <h1>Aiko</h1>
      <div id="mode">Chargement…</div>
    </div>
    <div id="status"></div>
  </header>
  <div id="thinking-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div id="toast"></div>
  <div id="mind" hidden role="dialog" aria-label="Ce qu'Aiko sait de toi">
    <div class="mind-head"><b>Ce qu'Aiko sait de toi</b><button type="button" id="mind-close" aria-label="Fermer">✕</button></div>
    <div class="mind-hint">Tout ce qu'elle a retenu. Touche ✎ pour corriger, ✕ pour effacer. Tu peux aussi lui dire « oublie que… ».</div>
    <div id="mind-body"></div>
  </div>
  <div class="controls">
    <div id="log" aria-live="polite"></div>
   <div id="panel" hidden>
    <div id="ptabs" role="tablist">
      <button class="chip on" type="button" data-ptab="tenues">Tenues</button>
      <button class="chip" type="button" data-ptab="pose">Pose</button>
      <button class="chip" type="button" data-ptab="reglages">Réglages</button>
    </div>
    <div class="row" id="row-outfit" data-tab="tenues" role="group" aria-label="Tenue">
      <button class="chip" type="button" data-outfit="nue">Nue</button>
      <button class="chip" type="button" data-outfit="moitie">Moitié</button>
      <button class="chip" type="button" data-outfit="habillee">Habillée</button>
    </div>
    <div id="wardrobe" data-tab="tenues" hidden></div>
    <div class="row" id="row-tint" data-tab="tenues" role="group" aria-label="Couleur de la tenue" hidden>
      <button class="chip" type="button" data-tint="">Gris</button>
      <button class="chip" type="button" data-tint="#16161a">Noir</button>
      <button class="chip" type="button" data-tint="#1d2a4d">Marine</button>
      <button class="chip" type="button" data-tint="#6b1626">Bordeaux</button>
      <button class="chip" type="button" data-tint="#14503f">Émeraude</button>
      <button class="chip" type="button" data-tint="#b9a58a">Sable</button>
    </div>
    <div class="row" id="row-pose" data-tab="pose" role="group" aria-label="Pose">
      <button class="chip" type="button" data-pose="front">Debout</button>
      <button class="chip" type="button" data-pose="sit">Assise</button>
      <button class="chip" type="button" data-pose="side">De côté</button>
      <button class="chip" type="button" data-pose="bed">Allongée</button>
    </div>
    <div class="row" id="row-shape" data-tab="pose" style="align-items:center;gap:10px">
      <label for="shape" style="font-size:12px;font-weight:700;color:#d8cfc6;white-space:nowrap">Silhouette</label>
      <input type="range" id="shape" min="0" max="100" step="5" style="flex:1;min-width:0;accent-color:#d5560f" aria-label="Silhouette : de fine à pulpeuse">
    </div>
    <div class="row" data-tab="reglages" role="group" aria-label="Options" style="flex-wrap:wrap;gap:6px 6px">
      <button class="chip on" type="button" id="btn-cheveux">Cheveux</button>
      <button class="chip" type="button" id="btn-lunettes">Lunettes</button>
      <button class="chip on" type="button" id="btn-voix">Voix</button>
      <button class="chip" type="button" id="btn-mind">Ce qu'elle sait de moi</button>
      <button class="chip" type="button" id="btn-phone">📱 Sur mon téléphone</button>
      <button class="chip" type="button" id="btn-brain">🧠 Cerveau (modèle)</button>
      <button class="chip" type="button" id="btn-reset">Réinitialiser</button>
      <label class="chip" for="file-vrm">＋ VRM perso</label>
      <input type="file" id="file-vrm" accept=".vrm,.glb" hidden>
    </div>
    <div class="credit" id="credit" data-tab="reglages"></div>
   </div>
    <div id="attach-chip" hidden><span></span><button type="button" aria-label="Retirer la pièce jointe">✕</button></div>
    <form id="chat-form" autocomplete="off">
      <button id="btn-panel" type="button" aria-label="Tenues, poses et réglages" aria-expanded="false">👗</button>
      <input id="chat-input" type="text" placeholder="Écris à Aiko…" maxlength="2000" enterkeyhint="send">
      <button id="btn-photo" type="button" aria-label="Joindre une image ou un document">📎</button>
      <input id="file-photo" type="file" accept="image/*,.txt,.md,.csv,.json,.html,.xml,.log,.docx,.pdf,.glb,.vrm" hidden>
      <button id="btn-mic" type="button" aria-label="Parler à Aiko">🎤</button>
      <button id="btn-send" type="submit" aria-label="Envoyer">➤</button>
    </form>
  </div>
  <div id="loader">
    <div class="spinner"></div>
    <div id="loader-msg">Chargement du modèle 3D…</div>
    <button id="loader-retry" type="button" hidden>Réessayer</button>
  </div>
</main>
<script>
/* Si les bibliothèques 3D n'arrivent pas (pas de réseau, CDN bloqué), on le dit au lieu de tourner sans fin. */
setTimeout(function () {
  if (!window.AIKO_STARTED) {
    document.getElementById('loader-msg').textContent =
      'Impossible de charger les bibliothèques 3D. Vérifie la connexion puis recharge la page.';
  }
}, 12000);
</script>
<script type="module">

// Bibliothèques 3D livrées avec la page (plus de dépendance à un site extérieur)
import { THREE, GLTFLoader, VRMLoaderPlugin, VRMUtils, VRMHumanoid, MeshoptDecoder, RoomEnvironment } from './aiko-3d.js';

const DEMO_VRM_URL = './sample.glb';

// Serveur perso (cerveau libre) : ?server=https://mon-serveur ou mémorisé. Vide = même origine.

try { SERVER = (new URLSearchParams(location.search).get('server') || localStorage.getItem('aiko.server') || '').replace(/\/$/, ''); if (new URLSearchParams(location.search).get('server')) localStorage.setItem('aiko.server', SERVER); } catch (_) {}
if (SERVER) for (const k of ['brain', 'brainStream', 'speak', 'life']) BACKEND[k] = SERVER + BACKEND[k];
BACKEND.health = [SERVER + '/api/health'];
try { if ('serviceWorker' in navigator && !SERVER && /^(https:|http:\/\/(localhost|127\.))/.test(location.href) && !/claude\.(ai|com)|claudeusercontent/.test(location.host) && location.host !== 'appassets.androidplatform.net') navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (_) {}
let ownOk = false;     // le serveur perso a un modèle configuré
// ---- Cerveau DIRECT : dans l'appli téléphone (ou sans serveur), la page parle elle-même à un modèle compatible OpenAI ----
const DIRECT_DEFAULT = { url: 'https://text.pollinations.ai/openai', model: 'openai', key: '' };   // sans clé, limité en débit ; réglable via 🧠

function loaderFail(msg) {
  loaderMsg.textContent = msg;
  loaderRetry.hidden = false;
}

function loadURL(url, isDemo, onFail) {
  gltfLoader.load(
    url,
    (g) => onLoaded(g, null, isDemo),
    (ev) => { if (ev.total) loaderMsg.textContent = 'Chargement du modèle 3D… ' + Math.round((ev.loaded / ev.total) * 100) + '%'; },
    (err) => { console.error(err); onFail(); }
  );
}

function loadDefault() {
  loaderEl.classList.remove('hidden');
  loaderRetry.hidden = true;
  loaderMsg.textContent = 'Chargement du modèle 3D…';
  // Page hébergée : le gabarit est livré à côté de la page, encodé dans model.json.
  const demo = async () => {
    try {
      const res = await fetch(new URLSearchParams(location.search).get('model') === 'preview' ? './model.preview.json' : './model.json');   // ?model=preview : aperçu d'un corps reconstruit sur son serveur
      if (!res.ok) throw new Error('HTTP ' + res.status);
      loaderMsg.textContent = 'Préparation du modèle 3D…';
      const bin = atob((await res.json()).b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      gltfLoader.parse(bytes.buffer, '', (g) => onLoaded(g, null, true),
        (err) => { console.error(err); loaderFail('Impossible de lire le modèle.'); });
    } catch (e) { console.error(e); loaderFail('Échec du chargement du modèle. Réessaie.'); }
  };
  if (LOCAL_VRM_URL) loadURL(LOCAL_VRM_URL, false, demo);
  else demo();
}

function loadVRMFile(f) {
  loaderEl.classList.remove('hidden');
  loaderRetry.hidden = true;
  loaderMsg.textContent = 'Lecture de « ' + f.name + ' »…';
  f.arrayBuffer()
    .then((buf) => gltfLoader.parse(buf, '', (g) => onLoaded(g, 'Modèle chargé : ' + f.name, false),
      (err) => { console.error(err); loaderFail('Impossible de lire ce fichier VRM.'); }))
    .catch(() => loaderFail('Impossible de lire ce fichier.'));
}

loaderRetry.addEventListener('click', loadDefault);

/* ---------- silhouette : proportions réglables (hanches, taille, buste) par mise à l'échelle du squelette ---------- */
let shapeV = clamp(Number(store.get('aiko.shape', '50')) || 0, 0, 100);
$('#shape').value = String(shapeV);
function applyShape() {
  if (!vrm || !vrm.humanoid) return;
  const raw = (n) => { try { return vrm.humanoid.getRawBoneNode(n); } catch (_) { return null; } };
  const t = shapeV / 100 * (1 - 0.6 * poseCur.sit);      // assise : effet réduit, sinon les cuisses à l'horizontale se déforment
  const h = 1 + 0.24 * t, w = 1 - 0.1 * t, c = 1 + 0.12 * t;      // hanches et cuisses, taille, buste
  const set = (b, k) => { if (b) b.scale.set(k, 1, k); };
  const hips = raw('hips'), spine = raw('spine'), chest = raw('upperChest') || raw('chest'), neck = raw('neck') || raw('head');
  if (!hips || !spine || !chest || chest === spine) return;
  set(hips, h); set(spine, w / h); set(chest, c / w); set(neck, 1 / c);
  set(raw('leftLowerLeg'), 1 / h); set(raw('rightLowerLeg'), 1 / h);   // mollets et pieds gardent leur taille
  for (const n of ['leftShoulder', 'rightShoulder']) { const b = raw(n); if (b) b.scale.setScalar(1); }
}
$('#shape').addEventListener('input', (e) => {
  shapeV = clamp(Number(e.target.value) || 0, 0, 100);

  applyShape();
});

  try { player.pause(); } catch (_) {}
  if (playerURL) { URL.revokeObjectURL(playerURL); playerURL = null; }

async function playB64(b64, mime, token) {
  let url;
  try {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    url = URL.createObjectURL(new Blob([bytes], { type: mime || 'audio/mpeg' }));
    buildEnvelope(bytes.buffer.slice(0), url);
  } catch (_) { return false; }
  playerURL = url;
  // On vérifie que l'évènement concerne bien CE son (pas le son de déverrouillage ni une phrase précédente).
  const mine = () => token === speakToken && playerURL === url;
  const done = () => { if (mine()) { mouthOn = false; clearTimeout(mouthTimer); } };
  player.onplaying = () => { if (mine()) { clearTimeout(mouthTimer); mouthOn = true; lip.src = 'audio'; lipGo(player.duration); } };  // bouche calée sur l'audio réel
  player.onended = () => { if (player.ended) done(); };
  player.onerror = done;
  player.src = url;
  try { await player.play(); return true; }
  catch (_) { return false; }
}

function speakLocal(text, token, est) {
  const synth = window.speechSynthesis;
  if (!synth || typeof SpeechSynthesisUtterance === 'undefined') { mouthFor(Math.min(est, 2500)); return; }
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 1.02;
    u.pitch = 1.15;
    const vs = synth.getVoices().filter((v) => /^fr/i.test(v.lang || ''));
    if (vs.length) u.voice = vs.find((v) => /fem|denise|julie|c[ée]line|am[ée]lie|audrey|charlotte|lo[iï]s|marie/i.test(v.name)) || vs[0];
    const end = () => { if (token === speakToken) { lipEnd(true); mouthOn = false; clearTimeout(mouthTimer); } };
    u.onstart = () => { if (token === speakToken) { mouthFor(est + 4000); lipGo(); } };
    u.onboundary = (ev) => { if (token === speakToken && ev && ev.name !== 'sentence') lipSync(ev.charIndex || 0); };
    u.onend = end;
    u.onerror = () => { if (token === speakToken) mouthFor(Math.min(est, 2500)); };   // pas de voix dispo : lèvres seules
    mouthFor(est);            // filet de sécurité si onstart/onend ne se déclenchent pas
    synth.speak(u);
  } catch (_) { mouthFor(Math.min(est, 2500)); }
}

/* ── Parole anticipée : Aiko commence à parler dès sa première phrase écrite, la suite est mise en file ──
   Seulement pour une réponse en direct ; si rien n'a pu être dit, on retombe sur speak() comme avant. */

    const call = sp.n === 1 ? cap.tts.speak : cap.tts.add;
    call([{ text: chunk.slice(0, 2000), id }], { voice: 'airy', language: 'fr' })
      .then(() => { sp.pending--; })

    return;
  }
  const synth = window.speechSynthesis;
  try {
    const u = new SpeechSynthesisUtterance(chunk);
    u.lang = 'fr-FR'; u.rate = 1.02; u.pitch = 1.15;
    const vs = synth.getVoices().filter((v) => /^fr/i.test(v.lang || ''));
    if (vs.length) u.voice = vs.find((v) => /fem|denise|julie|c[ée]line|am[ée]lie|audrey|charlotte|lo[iï]s|marie/i.test(v.name)) || vs[0];
    const est = clamp(chunk.length * 65, 1200, 12000);
    u.onstart = () => { if (token !== speakToken) return; sp.played = true; lipPrep(chunk, 'local'); lipGo(); mouthFor(est + 4000); };
    u.onboundary = (ev) => { if (token === speakToken && ev && ev.name !== 'sentence') lipSync(ev.charIndex || 0); };
    u.onend = () => { sp.pending--; if (token !== speakToken) return; lipEnd(true); if (!sp.pending && !sp.on) { mouthOn = false; clearTimeout(mouthTimer); } };
    u.onerror = () => { sp.pending--; if (token === speakToken) sp.failed = true; };

  const rest = vis.slice(sp.spoken);

  if (sp.failed && !sp.played) { speak(reply); return; }

async function speak(text) {
  if (!text) return;
  stopSpeech();
  const token = speakToken;
  const est = clamp(text.length * 65, 1500, 12000);
  lipPrep(text, cap.tts && voiceOn ? 'tts' : 'local');
  if (!voiceOn) { mouthFor(Math.min(est, 2500)); return; }
  if (cap.tts) {
    try {
      mouthFor(est + 6000);                       // filet : l'état « speaking/idle » prend le relais
      await cap.tts.speak(text.slice(0, 2000), { voice: 'airy', language: 'fr' });
      if (token === speakToken) lipEnd(true);
      if (token === speakToken) { mouthOn = false; clearTimeout(mouthTimer); }
      return;
    } catch (e) {
      if (token !== speakToken) return;
      mouthOn = false; clearTimeout(mouthTimer);
      const code = e && e.code;
      if (code === 'not_granted') cap.tts = null;
      else if (code !== 'unavailable' && code !== 'capability_disabled') return;   // arrêtée, occupée, limitée : on se tait
    }
  }
  if (backendOk) {
    try {
      const res = await fetchT(BACKEND.speak, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      }, TIMEOUT.speak);
      if (token !== speakToken) return;
      if (res.ok) {
        const data = await res.json();
        if (token !== speakToken) return;
        if (data && data.audio && await playB64(data.audio, data.mime, token)) return;
      }
    } catch (_) { /* repli ci-dessous */ }
    if (token !== speakToken) return;
  }
  speakLocal(text, token, est);
}

async function askBackend(text) {
  try {
    const res = await fetchT(BACKEND.brain, {

      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, persona: 'aiko', memories, look: demoLock ? 'habillee' : currentOutfit, pose: currentPose, session }),
    }, (backendOk || backendSeen) ? TIMEOUT.brain : TIMEOUT.brainUnknown);
    if (!res.ok) {
      let detail = '';
      try { const j = await res.json(); if (j && typeof j.detail === 'string') detail = j.detail; } catch (_) {}
      return { error: detail || ('HTTP ' + res.status) };
    }
    const data = await res.json();
    const reply = data && (data.reply || data.message);
    if (typeof reply !== 'string' || !reply.trim()) return { error: 'réponse vide' };
    return { data, reply: reply.trim() };
  } catch (e) {
    return { error: e && e.name === 'AbortError' ? 'délai dépassé' : 'connexion impossible' };
  }
}

// Réponse au fil de l'eau. Retourne {data, reply}, {error} ou {unsupported} (alors : appel classique).
let streamOk = true;
async function askBackendStream(text, onDelta) {
  const ctl = new AbortController();
  const limit = (backendOk || backendSeen) ? TIMEOUT.brain : TIMEOUT.brainUnknown;
  let timer = setTimeout(() => ctl.abort(), limit);
  const alive = () => { clearTimeout(timer); timer = setTimeout(() => ctl.abort(), TIMEOUT.brain); };   // délai d'inactivité
  let got = false;
  try {
    const res = await fetch(BACKEND.brainStream, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, persona: 'aiko', memories, look: demoLock ? 'habillee' : currentOutfit, pose: currentPose, session }),
      signal: ctl.signal,
    });
    if (res.status === 404 || res.status === 405 || res.status === 501 || !res.body || !res.body.getReader) return { unsupported: true };
    if (!res.ok) {
      let detail = '';
      try { const j = await res.json(); if (j && typeof j.detail === 'string') detail = j.detail; } catch (_) {}
      return { error: detail || ('HTTP ' + res.status) };
    }
    if (!/event-stream/.test(res.headers.get('content-type') || '')) return { unsupported: true };
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      alive();
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        for (const line of block.split('\n')) {
          if (!line.startsWith('data:')) continue;
          let ev; try { ev = JSON.parse(line.slice(5)); } catch (_) { continue; }
          if (typeof ev.delta === 'string') { got = true; onDelta(ev.delta); }
          else if (ev.error) return { error: String(ev.error), partial: got };
          else if (ev.done && typeof ev.reply === 'string' && ev.reply.trim()) return { data: ev, reply: ev.reply.trim() };
        }
      }
    }
    return { error: 'réponse interrompue', partial: got };
  } catch (e) {
    return { error: e && e.name === 'AbortError' ? 'délai dépassé' : 'connexion impossible', partial: got };
  } finally { clearTimeout(timer); }
}

const FING_MAX = [1.35, 1.6, 1.0];             // repli des formes simples (une valeur par doigt), inchangé
const FING_ROM = [1.55, 1.9, 1.4];             // amplitude humaine par phalange (base ~89°, milieu ~109°, bout ~80°)
const FING_HYP = [0.35, 0.05, 0.12];           // extension au-delà du plat (base surtout)
const FING_SPR = { Index: -0.34, Middle: -0.1, Ring: 0.14, Little: 0.4 };
function applyHand(set, shape, w, side) {
  const S = typeof shape === 'object' && shape ? shape : HAND[shape]; if (!S || !set) return;
  const sg = side > 0 ? 1 : -1;
  for (const f of ['Index', 'Middle', 'Ring', 'Little']) {
    const ch = set[f] || [], v = S[f];
    ch.forEach((n, i) => {
      let a;
      if (Array.isArray(v)) { const x = v[Math.min(i, v.length - 1)]; a = x >= 0 ? x * FING_ROM[i] : x * FING_HYP[i]; }   // contrôle phalange par phalange
      else a = (v || 0) * FING_MAX[i];
      n.rotation.z = n.rotation.z * (1 - w) + sg * a * w;
    });
    if (ch[0]) {                                                        // écartement / rapprochement des doigts (valeur fixée, jamais cumulée d'une image à l'autre)
      const sp = typeof S.Spread === 'number' ? FING_SPR[f] * S.Spread * (window.__spr ?? 1) : (S.Spread && S.Spread[f]) || 0;
      ch[0].rotation.y = ch[0].rotation.y * (1 - w) + sg * sp * w;
    }
  }
  const th = set.Thumb || [], T = S.Thumb;
  if (T && typeof T === 'object') {                                    // pouce complet : rotations par articulation [x,y,z] (rad)
    th.forEach((n, i) => { const r = T[i] || [0, 0, 0];
      n.rotation.x = n.rotation.x * (1 - w) + r[0] * w; n.rotation.y = n.rotation.y * (1 - w) + sg * r[1] * w; n.rotation.z = n.rotation.z * (1 - w) + sg * r[2] * w; });
    return;
  }
  th.forEach((n, i) => {                           // le pouce se replie vers la paume
    const c = (T || 0) * [0.5, 0.8, 0.9][i];
    n.rotation.y = n.rotation.y * (1 - w) + sg * (window.__thy ?? 1) * c * w;
    n.rotation.z = n.rotation.z * (1 - w) + sg * (window.__thz ?? 0) * c * w;
  });
}

      if (p >= 1) { setExpr(microName, 0); microName = ''; microW = 0; }
    }
    setExpr('browIdle', 0.06 * Math.max(0, fbm(tNow * 0.26, 9.1)) * (1 - ew));   // sourcils jamais parfaitement immobiles
    // clignement : fermeture rapide (~90 ms), réouverture plus lente (~170 ms) ; parfois double ; plus fréquent en parlant, plus rare en se concentrant
    nextBlink -= dt;
    if (nextBlink <= 0 && blinkT < 0) {
      blinkT = 0;
      nextBlink = (1.8 + Math.random() * 2.8) * (mouthOn ? 0.6 : 1) * (thinking ? 1.6 : 1);
      dblink = Math.random() < 0.12; window.__blinks = (window.__blinks || 0) + 1;
    }
    if (blinkT >= 0) {
      blinkT += dt;
      const CL = 0.09, OP = 0.17;
      let bv = blinkT < CL ? blinkT / CL : (blinkT < CL + OP ? 1 - (blinkT - CL) / OP : 0);
      setExpr('blink', Math.max(0, bv));
      if (blinkT >= CL + OP) { if (dblink) { dblink = false; blinkT = 0.0001; } else blinkT = -1; }
    }
    // bouche : active uniquement pendant la parole
    if (mouthOn || mouthWas) {
      // bouche : chaque son a sa forme (visèmes), lissée d'un son à l'autre ; le volume réel module l'ouverture si on l'a
      let gate = 1;
      if (mouthOn && lipEnv && lipEnv.url === playerURL && !player.paused) {
        const lv = lipEnv.data[Math.floor(player.currentTime / lipEnv.step)] || 0;
        mouthV += (lv - mouthV) * Math.min(1, dt * 22);
        gate = Math.min(1, 0.35 + mouthV * 1.6);
      }
      const T = mouthOn ? lipTargets(tNow) : {};
      const k = Math.min(1, dt * 24);
      let any = 0;
      for (const v of LIP_V) { lip.cur[v] += (((T[v] || 0) * gate) - lip.cur[v]) * k; any += lip.cur[v]; }
      setVisemes();
      mouthWas = mouthOn || any > 0.01;
      if (!mouthWas) { for (const v of LIP_V) lip.cur[v] = 0; setVisemes(); mouthV = 0; }
    }
    // émotion qui s'estompe
    if (emotion) {
      emotionW -= dt * (emotionW > 0.3 ? 0.22 : 0.006);     // pic, puis humeur de fond qui s'efface en ~45 s
      if (emotionW <= 0) { setExpr(emotion, 0); emotion = null; }
      else setExpr(emotion, Math.min(1, emotionW * 1.8));
    }
    // regard : vers la caméra, décalé par le pointeur (repère local de la caméra)
    gazeNext -= dt;
    if (gazeNext <= 0 && !mouthOn) {
      gazeT = 0.8 + Math.random() * 0.9;
      gazeX = (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 0.5);
      gazeY = -0.15 + Math.random() * 0.3;
      gazeNext = 6 + Math.random() * 9;
      if (blinkT < 0 && Math.random() < 0.35) blinkT = 0;   // un clignement accompagne souvent un grand changement de regard
    }
    if (gazeT > 0) gazeT -= dt;
    const gk = Math.min(1, dt * 8);
    const thinkGaze = thinking && !mouthOn;                       // elle réfléchit : le regard part en haut, sur le côté
    gazeCX += ((thinkGaze ? 0.42 * shiftDir : gazeT > 0 ? gazeX : 0) - gazeCX) * gk;
    gazeCY += ((thinkGaze ? 0.22 : gazeT > 0 ? gazeY : 0) - gazeCY) * gk;
    // saccades : le regard saute d'un point à l'autre, il ne glisse pas
    sacT -= dt;
    if (sacT <= 0) { sacT = 0.6 + Math.random() * 2.2; sacX = (Math.random() - 0.5) * 0.09; sacY = (Math.random() - 0.5) * 0.05; }
    lookAtTarget.position.set(mouse.x * 0.5 + gazeCX + sacX, mouse.y * 0.35 + gazeCY + sacY, 0);
    if (lib && lw > 0) { applyFk(lib, gt, lw * (1 - poseCur.lie), b); if (lib.ground || (lib.legs && !AIRBORNE.test(gst.name))) groundBody(b, lw * (1 - poseCur.lie)); applyLib(lib, gt, lw * (1 - poseCur.lie), b); }
    if (gst && gst.clip) { const cw = ge * (1 - poseCur.lie) * (1 - poseCur.sit); applyClip(gst, cw, b); if (!AIRBORNE.test(gst.name + ' ' + (gst.en || ''))) groundBody(b, cw); }   // danses et marches posées au sol (sauf vrais sauts)
    if (gst !== XF.last) { if (XF.last && gst && poseCur.lie < 0.3) xfadeStart(); XF.last = gst; if (!gst || !gst.clip) footLockReset(); }   // changement de geste : fondu depuis la pose réelle
    xfadeApply(b, dt);
    if (gst && gst.clip && !AIRBORNE.test(gst.name + ' ' + (gst.en || '')) && poseCur.lie < 0.3 && poseCur.sit < 0.3) footLock(b, dt, ge); else footLockReset();
    // la caméra suit doucement le corps quand il se déplace (mouvement de la bibliothèque), puis revient au centre
    { let fx = 0, fz = 0;
      if (gst && gst.clip && gst.clip.dx && b.hips) { b.hips.getWorldPosition(_fv); fx = _fv.x; fz = _fv.z; }
      const k = Math.min(1, dt * 2.5); camFollow.x += (fx - camFollow.x) * k; camFollow.z += (fz - camFollow.z) * k;
      target.x = camFollow.x; target.z = camFollow.z; }
    try { propUpdate(lib && lw > 0 ? lib : null, gt, b); } catch (e) { console.warn('objet', e); }
    if (!window.__noKeepOut && poseCur.lie < 0.5) { try { armKeepOut(b); } catch (e) {} }
    if (SKIN.ok && !window.__noContact) {                // mains et avant-bras : posés sur la peau, jamais dedans
      rig.updateMatrixWorld(true); skinUpdate();
      handContact(b.lArm, b.lLowArm, b.lHand); handContact(b.rArm, b.rLowArm, b.rHand);
    }
    // plantage au sol : après la flexion, on abaisse tout le corps pour que le point le plus bas (pied ou genou) touche le sol
    if (fpd && body.anchL) {
      rig.updateMatrixWorld(true);
      let minY = Infinity;
      const contact = fpd.knees ? [b.lLowLeg, b.rLowLeg, b.lToes, b.rToes] : [b.lFoot, b.rFoot, b.lToes, b.rToes];   // à genoux : les tibias touchent le sol ; sinon les pieds
      for (const f of contact) if (f) minY = Math.min(minY, f.getWorldPosition(_fv).y);
      if (isFinite(minY)) rig.position.y += (body.anchL.y - minY) * freeW;
    }
    lastRigY = rig.position.y - (body.height / 2 * 0) - (BED_H + 0.1) * poseCur.lie;
    try { romApply(dt); } catch (_) {}
    try { xfadeCapture(b); } catch (_) {}
    if (bones.hips) { bones.hips.getWorldPosition(_jw); SQ.uHip.value.set(_jw.x, _jw.z); SQ.uSquash.value = window.__nosquash ? 0 : 1; }
    try { correctivesUpdate(); } catch (_) {}
    vrm.update(dt);
    jigUpdate(dt);
    buttBounce();
  }
  try { autoCamUpdate(0); } catch (e) {}
  updateCamera();
  renderer.render(scene, camera);
}

// ---- 🧠 Cerveau d'Aiko : état réel de ses modules + choix de son moteur ----
(function () {
  const b = document.getElementById('btn-brain'); if (!b) return;
  b.textContent = '🧠 Cerveau d\'Aiko';
  const PRESETS_B = [
    ['Pollinations (sans clé)', 'https://text.pollinations.ai/openai', 'openai'],
    ['OpenRouter (clé gratuite)', 'https://openrouter.ai/api/v1', 'mistralai/mistral-small-3.2-24b-instruct'],
    ['Groq (clé gratuite)', 'https://api.groq.com/openai/v1', 'llama-3.3-70b-versatile'],
    ['DeepSeek (clé)', 'https://api.deepseek.com/v1', 'deepseek-chat'],
    ['Grok / xAI (clé)', 'https://api.x.ai/v1', 'grok-3-mini'],
  ];
  const esc = (x) => String(x == null ? '' : x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function stats() {
    const B = brainState(), now = Date.now(), h = [];
    const sec = (t, body) => h.push('<div style="margin:10px 0 4px;font-weight:700">' + t + '</div>' + body);
    const usingBrain = cap.sample ? 'Claude (dans l\'app Claude)' : (ownOk && !DIRECT) ? 'ton serveur' : 'ses propres moteurs (sans Claude)';
    h.push('<div style="font-size:12px;color:#555">Elle pense en ce moment avec : <b>' + esc(usingBrain) + '</b> · ' + (B.turns || 0) + ' messages analysés</div>');
    sec('Lexa — moteurs', '<table style="width:100%;font-size:12px;border-collapse:collapse">' + engineList().map((e) => { const st = B.eng[e.id] || {}; const pause = st.until > now;
      return '<tr><td>' + esc(e.name) + '</td><td style="text-align:right">' + (st.ok || 0) + ' ✓ · ' + (st.fail || 0) + ' ✗' + (st.ms ? ' · ' + (st.ms / 1000).toFixed(1) + ' s' : '') + '</td><td style="text-align:right;color:' + (pause ? '#b3261e' : st.ok ? '#1b7a3a' : '#777') + '">' + (pause ? 'en pause' : st.ok ? 'actif' : 'pas encore essayé') + '</td></tr>' + (st.err && !st.ok ? '<tr><td colspan=3 style="color:#999;font-size:11px">' + esc(st.err) + '</td></tr>' : ''); }).join('') + '</table>');
    const tot = Object.values(B.dom).reduce((a, v) => a + v, 0);
    const doms = Object.entries(B.dom).filter((x) => x[1] > 0.05).sort((x, y) => y[1] - x[1]).slice(0, 6);
    sec('DomainProfiler — ce qui compte pour toi', doms.length ? doms.map(([k, v]) => { const p = Math.round(100 * v / (tot || 1)); return '<div style="font-size:12px">' + esc(DOMAINS[k].n) + ' <span style="color:#777">' + p + ' %</span><div style="height:6px;background:#eee;border-radius:3px"><div style="height:6px;width:' + p + '%;background:#d5560f;border-radius:3px"></div></div></div>'; }).join('') : '<div style="font-size:12px;color:#777">Pas encore assez de messages.</div>');
    const sat = Object.entries(B.sat);
    sec('Kaizen — tes 👍 / 👎 par domaine', sat.length ? '<div style="font-size:12px">' + sat.map(([k, v]) => esc(DOMAINS[k] ? DOMAINS[k].n : 'Conversation perso') + ' : ' + (v.up || 0) + ' 👍 · ' + (v.down || 0) + ' 👎').join('<br>') + '</div>' : '<div style="font-size:12px;color:#777">Réagis avec 👍 / 👎 sous ses réponses.</div>');
    sec('Guardian — protection', '<div style="font-size:12px">' + B.guard.n + ' intervention' + (B.guard.n > 1 ? 's' : '') + (B.guard.log.length ? '<br>' + B.guard.log.slice(-3).reverse().map((g) => '· ' + esc(g.k) + ' : ' + esc(g.w)).join('<br>') : '') + '</div>');
    sec('Missions', B.missions.length ? '<div style="font-size:12px">' + B.missions.slice(-5).reverse().map((m) => '· ' + esc(m.goal) + ' — <b>' + esc(m.status) + '</b> (' + m.steps.filter((x) => x.status === 'fait').length + '/' + m.steps.length + ' étapes)').join('<br>') + '</div>' : '<div style="font-size:12px;color:#777">Écris « mission : … » pour lui confier un objectif : elle planifie, exécute, vérifie et corrige chaque étape.</div>');
    const cp = Object.entries(B.comp || {}).sort((x, y) => y[1] - x[1]).slice(0, 6);
    sec('Compétences — méthodes les plus utilisées', cp.length ? '<div style="font-size:12px">' + cp.map(([k, v]) => esc(COMPS[k] ? COMPS[k].n : k) + ' ' + v).join(' · ') + '</div>' : '<div style="font-size:12px;color:#777">2 toujours actives (raisonnement, fiabilité) + jusqu\'à 4 choisies selon ton message.</div>');
    const C = B.cur || { log: [], auto: false };
    sec('Curriculum — ce qu\'elle a étudié seule', '<div style="font-size:12px">' + (C.log.length ? C.log.slice(-5).reverse().map((x) => (x.ok ? '✓ ' : '· ') + esc(x.t) + ' — ' + esc(x.note)).join('<br>') : 'Rien étudié pour l\'instant.') + '<br><button id="b-study" type="button" style="margin:8px 0;padding:7px 12px;border:1px solid #d5560f;border-radius:14px;background:#fff;color:#d5560f;font-size:12px">Étudier maintenant</button> <label style="font-size:12px"><input id="b-auto" type="checkbox"' + (C.auto !== false ? ' checked' : '') + '> apprendre seule toutes les 20 min (page ouverte)</label></div>');
    return h.join('');
  }
  b.addEventListener('click', () => {
    const c = directCfg();
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:100;background:rgba(10,8,12,.86);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;color:#18101a;border-radius:18px;padding:16px;max-width:420px;width:100%;font:14px/1.4 system-ui,sans-serif;margin:auto';
    const inp = 'width:100%;box-sizing:border-box;padding:9px;margin:4px 0 10px;border:1px solid #ccc;border-radius:8px;font:14px system-ui';
    box.innerHTML = '<b style="font-size:16px">🧠 Cerveau d\'Aiko</b><div id="b-stats">' + stats() + '</div>'
      + '<hr style="border:0;border-top:1px solid #eee;margin:14px 0"><b>Ton moteur</b><p style="margin:6px 0;font-size:12px;color:#555">Facultatif. S\'il est réglé, Lexa l\'essaie en premier ; sinon elle utilise ses moteurs gratuits. Ses limites sont celles du moteur choisi.</p><div id="pr" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>'
      + '<label>Adresse</label><input id="b-url" style="' + inp + '"><label>Modèle</label><input id="b-model" style="' + inp + '"><label>Clé (laisser vide si aucune)</label><input id="b-key" type="password" autocomplete="off" style="' + inp + '">'
      + '<label style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><input id="b-on" type="checkbox"> Penser avec ses propres moteurs (sans serveur ni Claude)</label>'
      + '<div style="display:flex;gap:8px"><button id="b-ok" type="button" style="flex:1;padding:10px;border:0;border-radius:10px;background:#d5560f;color:#fff;font-size:14px">Enregistrer</button><button id="b-x" type="button" style="padding:10px 16px;border:0;border-radius:10px;background:#18101a;color:#fff;font-size:14px">Fermer</button></div>';
    ov.appendChild(box); document.body.appendChild(ov);
    const g = (id) => box.querySelector('#' + id);
    g('b-url').value = c.url; g('b-model').value = c.model; g('b-key').value = c.key || ''; g('b-on').checked = DIRECT;
    PRESETS_B.forEach(([n, u, m]) => { const p = document.createElement('button'); p.type = 'button'; p.textContent = n; p.style.cssText = 'padding:6px 10px;border:1px solid #d5560f;border-radius:14px;background:#fff;color:#d5560f;font-size:12px'; p.onclick = () => { g('b-url').value = u; g('b-model').value = m; }; g('pr').appendChild(p); });
    const wireCur = () => {
      g('b-auto').onchange = () => { const q = brainState(); q.cur = q.cur || { log: [], auto: false }; q.cur.auto = g('b-auto').checked; brainSave(q); };
      g('b-study').onclick = async () => { g('b-study').disabled = true; g('b-study').textContent = 'Elle étudie…'; await studyOnce(null, true); g('b-stats').innerHTML = stats(); wireCur(); };
    };
    wireCur();
    g('b-x').onclick = () => ov.remove(); ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
    g('b-ok').onclick = () => {
      try { localStorage.setItem('aiko.direct', JSON.stringify({ url: g('b-url').value.trim(), model: g('b-model').value.trim(), key: g('b-key').value.trim() })); localStorage.setItem('aiko.directOn', g('b-on').checked ? '1' : '0'); } catch (_) {}
      DIRECT = IN_APP || /\.github\.io$/.test(location.host) || g('b-on').checked; ov.remove(); setStatus(); showToast('Cerveau enregistré');
    };
  });
})();
</script>
